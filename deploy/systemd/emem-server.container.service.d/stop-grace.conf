# Give the store time to close. With no write live, redb's close is a durable
# commit of the allocator state plus an fsync of everything written since the
# last durable commit, and it has no budget of its own. On 2026-09-28 it ran
# past docker's 120 s stop grace, the SIGKILL left the file marked for
# recovery, and the next boot spent 29 minutes rebuilding it. Ten minutes of
# stop is cheaper than half an hour of rebuild.
#
# Install: sudo install -D -m 644 ops/systemd/emem-server.service.d/stop-grace.conf \
#            /etc/systemd/system/emem-server.service.d/stop-grace.conf
#          sudo systemctl daemon-reload   (takes effect at the next stop; no restart needed)
[Service]
TimeoutStopSec=630
ExecStop=
ExecStop=/usr/bin/docker stop -t 600 emem-server

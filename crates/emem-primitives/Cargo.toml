[package]
name = "emem-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "emem read primitives: recall, query_region, compare, find_similar, verify, diff, trajectory"

[dependencies]
emem-core    = { workspace = true }
emem-fact    = { workspace = true }
emem-claim   = { workspace = true }
emem-cache   = { workspace = true }
emem-storage = { workspace = true }
emem-codec   = { workspace = true }
emem-fetch   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
ciborium     = { workspace = true }
thiserror    = { workspace = true }
async-trait  = { workspace = true }
tokio        = { workspace = true }
blake3       = { workspace = true }
tracing      = { workspace = true }
futures-util = { workspace = true }
data-encoding = { workspace = true }
# ed25519 verification for the memory-write attester binding
# (memory_acl). Pubkey/sig round-trip in the verifier only — no signing
# from this crate; signing stays in the responder identity at the
# server layer.
ed25519-dalek = { workspace = true }

# Lance — embedded columnar/vector index. The brute-force find_similar
# path remains as a fallback; Lance is an ANN accelerator over per-dim
# FixedSizeList<Float32> partitions. Disabled features that pull in
# cloud object stores so a default build stays light: aws/azure/gcp/oss/
# huggingface/tencent and geo are all off, leaving only the local
# columnar file format + index machinery.
lance        = { version = "6.0.1", default-features = false }
lance-index  = { version = "6.0.1", default-features = false }
lance-linalg = { version = "6.0.1" }
arrow-array  = "58"
arrow-schema = "58"

# Text embedder for `memory_search` — BGE-base-en-v1.5 ONNX inference.
# Mirrors the topic-router setup in emem-api-rest: direct ort 2.x +
# tokenizers, no fastembed-rs wrapper. The model is loaded lazily on
# first call so a build without the model still compiles + serves
# everything else; missing-model is surfaced via the search endpoint
# as a typed "model not present" error, never as random vectors.
ort             = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24", "download-binaries", "tls-rustls"] }
ort-ndarray     = { package = "ndarray", version = "0.17" }
tokenizers      = { version = "0.22", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile     = "3"
rand         = { workspace = true }
tokio        = { workspace = true, features = ["macros", "rt-multi-thread"] }

# Dependency updates, kept to one grouped pull request per ecosystem per
# month. Each pull request runs the full ci workflow, macOS test included
# (about 90 minutes), so a pull request per crate would cost more than it
# finds. Security advisories are not delayed by this schedule: Dependabot
# security updates open their own pull requests when an advisory lands.
version: 2
updates:
  # Every action is pinned to a full commit SHA with its tag in a comment
  # (AGENTS.md); Dependabot moves the SHA and the comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"

  # Semver-compatible updates within Cargo.lock. A major bump changes the
  # MSRV or an API the receipt path depends on, so it stays a deliberate edit.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      cargo:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ort and ort-sys 2.0.0-rc.15 need rustc 1.92, above the 1.91 MSRV, and
      # rc.15 removed EnvironmentBuilder::commit, which emem-api-rest and
      # emem-primitives call. Both crates pin =2.0.0-rc.12. Remove these two
      # rules when the MSRV moves to 1.92 and the ORT setup is ported.
      - dependency-name: "ort"
        versions: [">2.0.0-rc.12"]
      - dependency-name: "ort-sys"
        versions: [">2.0.0-rc.12"]
    commit-message:
      prefix: "Deps"

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run for the same ref when a new commit lands, so a
# wedged job (see the macOS cache note below) never keeps burning a runner
# after it has been superseded.
concurrency:
  # On main the group is per-COMMIT, which is what actually stops main runs
  # being cancelled. `cancel-in-progress: false` was believed to do that and
  # does not: it protects a RUNNING run, and GitHub's documented behaviour for
  # the group is that "when a new job or workflow run is queued, any existing
  # pending job or workflow run in the same group is canceled and replaced".
  # So while one main run was in progress, the next push queued behind it and
  # the push after that evicted it before a single job started.
  #
  # Observed on 2026-08-13: the ci runs for b7a353a and 2ed6962 both ended
  # `cancelled` with total_count 0 jobs, 12 minutes after being created, on
  # branch main, with cancel-in-progress already false. This is the failure the
  # comment below was written to prevent, still happening, because the fix
  # addressed the wrong half of the mechanism.
  #
  # Per-commit groups on main never collide, so nothing queues and nothing is
  # evicted: every commit gets a conclusive run. Branches keep one group per
  # ref so a rapid iteration still cancels its own superseded runs.
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  # Cancel superseded runs on branches and PRs, never on main.
  #
  # On a branch this saves an hour of runners when you push three times
  # while iterating, and the only signal lost is about a commit nobody
  # will look at again. On main it destroys the signal itself: the badge
  # reports the newest CONCLUSIVE run, and a cancelled run is not one, so
  # a stretch of quick pushes leaves the badge pinned to whatever the last
  # completed run said. On 2026-08-05 that meant main read "failing" for
  # seven hours and eight commits after the failure had been fixed, because
  # every run that would have proved it green was killed by the next push.
  #
  # Correctness of the badge is worth more than the runner minutes: a red
  # badge nobody trusts is the same as no badge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The /docs/ site is rendered at build time by mdbook and baked into the
  # signed binary via `include_dir!("docs/book")` in emem-api-rest. The
  # output is gitignored, so every CI job that compiles emem-api-rest must
  # build the book first. Pinned to a known-good version.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install protoc (lance build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Hard cap so a wedged post-run (cache save / process reaping) can't run
    # to GitHub's 6h ceiling. The cold macOS release build (lance/arrow,
    # ort/ONNX, no target cache) measured 70.9 min on the last green main
    # run and got cancelled at a 60-min cap on 2026-07-11, so the cap is
    # sized from that measurement plus headroom, not from optimism.
    #
    # Re-sized 2026-07-15, same reasoning against a newer measurement. The
    # macOS job had grown into its own cap: 86.1 min on the last green main
    # run (5d38a95) against a 90-min limit is 4 min of headroom, and the next
    # push (db9d663) took 90.5 min and was cancelled at the cap. Ubuntu over
    # the same pair moved 30.2 -> 29.4 min, so this is the cold macOS build
    # drifting plus runner variance, not a test that got slower: a 96%-full
    # cap fails on whichever commit happens to draw a slow runner, which
    # reads as "your change broke CI" and is not true. Per-OS now, because
    # one number cannot be both a real backstop for ubuntu (~30 min) and
    # honest headroom for macOS (~90).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 120 || 60 }}
    # macOS test is BLOCKING again (was temporarily non-blocking). A GitHub
    # macOS image/Xcode update had broken linking of the `ort` (ONNX
    # Runtime) prebuilt static lib against the clang runtime — `ld: library
    # 'clang_rt.osx' not found` — failing every ort-linked binary at LINK
    # time regardless of source. The "macOS clang_rt link path" step below
    # locates libclang_rt.osx.a under the active toolchain and adds it to
    # the linker search path; with that in place the macOS suite links and
    # passes (verified green on eff7754), so the gate is restored. If a
    # future runner image moves the lib, that step logs "not found" and the
    # link failure surfaces here loudly rather than being masked.
    strategy:
      # One platform failing must not cancel the other: the point of a matrix
      # is two independent answers.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The macOS release target/ is multi-GB (lance/arrow, ort/ONNX);
          # its post-job cache save could stall for a very long time on the
          # slower macOS runners, which is the wedge the job-level
          # timeout-minutes now also backstops. Skip target caching on macOS,
          # and only save the cache from main so PR runs never pay the upload.
          cache-targets: ${{ matrix.os != 'macos-latest' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install protoc (lance build scripts, ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (lance build scripts, macos)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf
      - name: macOS clang_rt link path (ort link fix)
        if: matrix.os == 'macos-latest'
        # A GitHub macOS image / Xcode update left the linker unable to
        # find libclang_rt.osx.a (the `ort` ONNX-Runtime prebuilt links the
        # clang runtime; ld: library 'clang_rt.osx' not found). Locate it
        # under the active toolchain and add its directory to the linker
        # search path so the ort-linked test binaries link. Best-effort: if
        # it isn't found we leave RUSTFLAGS unchanged and the link failure
        # surfaces in the (now blocking) test step rather than being masked.
        run: |
          RT=$(find "$(xcode-select -p)" /Library/Developer/CommandLineTools \
                 -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          if [ -n "$RT" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS} -L $(dirname "$RT")" >> "$GITHUB_ENV"
            echo "added clang_rt search path: $(dirname "$RT")"
          else
            echo "libclang_rt.osx.a not found under the active toolchain"
          fi
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo test --workspace --release

  msrv:
    name: minimum supported rust 1.91
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: install protoc (lance build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo build --workspace

  # Surfaces RustSec advisories for our transitive deps. Fails only on
  # actual `vulnerability` advisories; informational findings
  # (e.g. sled is implicitly unmaintained — tracked, migration to redb
  # is on the deferred punch list) are reported but don't block the
  # build. We re-evaluate the ignore list whenever the advisory db
  # adds something. Plain `cargo audit` rather than the
  # `rustsec/audit-check` action because the action posts a GitHub
  # check-run, which requires `checks: write` we don't otherwise need.
  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        # Plain `cargo audit` exits non-zero only on `vulnerability`
        # findings; informational warnings (unmaintained, yanked,
        # notice) are surfaced in the log but don't fail CI.
        run: cargo audit

  python-sdks:
    name: python SDK tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the package floor (declared in pyproject.toml); 3.12
        # catches warnings from newer interpreter behaviour. These two
        # bracket the supported range.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "pytest>=8.0" "respx>=0.21" "langchain-core>=0.3,<1.0" "blake3>=0.3" "cryptography>=41"
      - name: emem-py parity tests
        run: PYTHONPATH=sdks/emem-py/src python -m pytest sdks/emem-py/tests/ -v
      - name: emem-langmem smoke tests
        run: PYTHONPATH=sdks/emem-langmem/src python -m pytest sdks/emem-langmem/tests/ -v
      # Nothing here ran the llama-index tool spec, so its suite proved
      # nothing about CI either. Only on 3.12: the package floor is 3.10 and
      # llama-index-core does not install on 3.9.
      #
      # The offline half only. tests/test_live_contract.py replays each
      # fixture's recorded request against production and would make this job
      # depend on the origin; it belongs with the live gates, and is run by
      # hand or from a machine that can reach the responder.
      - name: llama-index tool spec tests
        if: matrix.python == '3.12'
        run: |
          python -m pip install "llama-index-core>=0.13.0,<0.15"
          PYTHONPATH=sdks/llama-index-tools-emem python -m pytest \
            sdks/llama-index-tools-emem/tests/test_emem_tool_spec.py -v
      # The two steps above put src/ on PYTHONPATH, so they pass whether or
      # not the built package contains any code. ememdev 1.0.0 shipped to
      # PyPI holding nothing but metadata, and this suite stayed green
      # through it. Build the artefact and import it out of a wheel, which
      # is the thing users actually install.
      - name: wheels contain their modules
        run: |
          python -m pip install --upgrade build
          for sdk in emem-py emem-langmem; do
            python -m build --wheel --outdir "dist-$sdk" "sdks/$sdk"
          done
          python - <<'PY'
          import glob, sys, zipfile

          failed = False
          for whl in sorted(glob.glob("dist-*/*.whl")):
              modules = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".py")]
              print(f"{whl}: {len(modules)} module(s)")
              if not modules:
                  print(f"  ERROR: {whl} ships no Python modules", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: an installed wheel imports
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist-emem-py/*.whl
          /tmp/wheelcheck/bin/python -c "import ememdev; print('ememdev', ememdev.__version__)"
          /tmp/wheelcheck/bin/pip install --quiet "langchain-core>=0.3,<1.0" "blake3>=0.3" "cryptography>=41"
          /tmp/wheelcheck/bin/pip install --quiet dist-emem-langmem/*.whl
          /tmp/wheelcheck/bin/python -c "import emem_langmem; print('emem_langmem', emem_langmem.__version__)"

  whitepaper:
    name: whitepaper HTML matches its markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # web/whitepaper-v2.html is generated from docs/whitepaper-v2.md and
      # baked into the binary with include_str!, so a stale commit ships a
      # page that contradicts its own source. That is exactly how v1's two
      # hand-written copies drifted apart.
      - name: rendered page is up to date
        run: python3 scripts/render_whitepaper.py --check

  doc-lint:
    name: prose convention holds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The convention CONTRIBUTING.md states, enforced instead of
      # remembered: no em/en dashes (legacy files ride a burn-down list
      # inside the script), no AGI-family vocabulary, no buzzword tells,
      # and every relative doc link resolving. Judgment calls stay with
      # review; this holds the mechanical floor.
      - name: doc lint
        run: python3 scripts/doc_lint.py
      # `include_str!` makes a repo file a BUILD input, and the Dockerfile
      # copies selectively, so adding an include in Rust can break the image
      # build from a file nobody edited. server.json did exactly that on
      # 2026-08-11: the release compile failed 1422 seconds in, thirteen
      # stages deep, with an error naming the include and not the missing
      # COPY. This is the same question answered from static text in about a
      # second, in the fast lane, before anything is built. It also catches
      # the nastier half, where a COPY exists and .dockerignore excludes the
      # file anyway, which is the trap that shipped two empty SDK wheels.
      - name: every compile-time include reaches the image
        run: python3 scripts/docker_context.py
      # actionlint validates the workflow files against the real Actions
      # schema. A duplicate `fail-fast:` once slipped past `yaml.safe_load`,
      # which keeps the last of two silently, and GitHub refused the file:
      # runs were created with ZERO jobs, named by file path, reporting
      # `failure`, which reads exactly like a broken test. A validator more
      # permissive than the consumer is not a validator, so use the one
      # written against the consumer.
      - name: actionlint
        run: |
          ver=1.7.7
          curl -sSL "https://github.com/rhysd/actionlint/releases/download/v${ver}/actionlint_${ver}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -shellcheck= -pyflakes= .github/workflows/*.yml
      # A route is either described in the OpenAPI document or excluded with a
      # written reason. Five live routes that llms.txt told agents to call sat
      # outside the document for weeks: nothing was false, the route was just
      # added in one place and not the other. Hermetic, so it runs here.
      - name: openapi coverage
        run: python3 scripts/openapi_coverage.py
      # A figure the homepage presents as live must not ship a number in the
      # HTML. Five tiles did, three had gone stale against the responder they
      # claimed to report, and the caption above them said nothing there was
      # typed in. Hermetic: it reads the markup, not the network.
      - name: live numbers are fetched, not typed
        run: python3 scripts/live_numbers.py
      # One token file, one scale, and a dark mode on every page. Every page
      # used to carry its own copy of the tokens; /guard rendered body copy at
      # 13.5px because of it, three pages requested no webfont at all, and
      # /verify shipped a light body over a dark palette when the migration
      # removed a dark :root it should not have. Hermetic.
      - name: the design system holds
        run: python3 scripts/design_tokens.py
      # Every provenance_class we emit must be one we declare. The upstream
      # found an undeclared class on ELEVEN of their surfaces, with the correct
      # diagnosis already written in their own tree and reaching one call site.
      # Ours was `rendering_of_measurement`, a hybrid name implying a hybrid
      # guarantee that does not exist. Fixing it once is the fix that already
      # failed for both of us, so it is checked instead. `none` is admitted as
      # an explicit statement that a thing sits outside the system, which is
      # not the same as an eighth class.
      - name: no undeclared provenance classes
        run: python3 scripts/provenance_classes.py
      # The third way a green line proves nothing: the right code present and
      # not the code running. Python binds the LAST def, so a replacement
      # spliced above an untouched original runs the original -- and json!
      # keeps the LAST duplicate key, so a second entry for an existing path
      # silently replaces its description. Both read as correct in the file.
      # The upstream hit the first twice in one day, once on a zero-guard whose
      # own control came back green because it was exercising the shadowed copy.
      - name: no shadowed definitions
        run: python3 scripts/shadowed_definitions.py
      # And the whole suite in dependency order. shadowed_definitions runs FIRST
      # there and the rest do not run if it fails, because a gate script with a
      # shadowed definition reports on code that is not running and its PASS
      # would mean nothing. In this file that check was LAST -- the trust check
      # at the end of the trusted things, which is where the upstream found
      # theirs too. The individual steps above stay for per-step CI granularity;
      # this one enforces the order they are written in.
      # What a credential scanner gets. The service sharing this box traced
      # 29,636 refused requests over 35 days to an automated secret hunter --
      # /.env, /.git/config, /.aws/credentials -- every one a 1 ms 404, which is
      # why nobody had looked. They 404 everything because they are an API; we
      # are the public page on the same host, with a build directory and a docs
      # tree and a 404 page of our own. It checks BODIES, not status codes, and
      # self-tests its own patterns first, because a clean report from a
      # detector that stopped matching looks exactly like a clean surface.
      - name: nothing a scanner asks for is served
        run: python3 scripts/scanner_surface.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
      - name: gates, in dependency order
        run: python3 scripts/gates.py
      # One navigation, generated from one definition. The site had SEVEN
      # different nav bars across 22 pages and between them they reached 13 of
      # 142 routes; /guard appeared in exactly one nav, its own. A hand edit to
      # any page's nav is drift, and this reports it.
      - name: one navigation, not seven
        run: python3 scripts/gen_nav.py --check
      # The ChatGPT submission declares MCP annotations that the server also
      # declares, and they had drifted: the submission called five tools
      # readOnlyHint:true while the server says false, because each can
      # materialize and sign new facts on a cold miss. Telling a directory a
      # writing tool is read-only is the one direction that is unsafe, and
      # nothing was watching the pair until a reviewer asked about a different
      # annotation entirely.
      - name: the submission says what the server says
        run: python3 scripts/submission_matches_server.py
      # The card declared preferredTransport HTTP+JSON while /a2a/tasks requires
      # the JSON-RPC envelope, so every client that believed the card got a 400
      # and the A2A registry's task_conformance probe failed on METHOD. A schema
      # check could not see it: the value was a legal transport name, just not
      # ours. This sends the shape the card promises and checks it is accepted.
      - name: the agent card describes the endpoint that answers
        run: python3 scripts/agent_card_conformance.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
      # Everything else emem serves carries an ed25519 receipt; the card that
      # advertises all of it was the one document nobody signed. This verifies
      # it as a stranger would, over HTTP, using only the published key.
      - name: the agent card verifies against its own published key
        run: python3 scripts/agent_card_signed.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
      # A ratchet, not a standard. tokens.css has carried a golden-ratio
      # spacing scale for a long time and the pages use it for 136 values
      # against 1382 hand-picked ones: every gap slightly different, which is
      # the restlessness a reader feels and cannot name. Rewriting 1382 values
      # blind on a live site is not something to do without eyes on the result,
      # so this holds the line at today's count and comes down as pages are
      # redesigned. It must never go up.
      - name: spacing comes from the scale
        run: python3 scripts/spacing_scale.py --budget 1379
      # live_numbers proves a figure is fetched. It cannot prove the fetch
      # finds anything: rename a field and put() is handed undefined, declines
      # to write, and the tile keeps its placeholder, so the page reads as
      # though the node were down while the node is fine. A 200 carrying a
      # renamed field passes route_truth, sync_counts and doc_lint alike.
      - name: the fields the pages read still exist
        run: |
          set +e
          python3 scripts/live_fields.py
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; live reads not asserted"
            exit 0
          fi
          exit $code
      # A count stated as prose has to match the responder it describes.
      # /whitepaper served "102 MCP tools (15 core, 87 extended)" against a
      # responder answering 107/16/91 while sync_counts reported no drift,
      # because the surface list and the phrase list were both hand-written.
      # This asserts the number. Needs the live responder, so it warns rather
      # than fails when the origin is unreachable.
      # Failing here now names the one-word fix, because every count corrected
      # by hand in this repo came back wrong within weeks: a typed number
      # cannot notice the world moved, and the person who moves it is rarely
      # the person who typed it. `--write` corrects the prose from the live
      # responder, and leaves records alone (plans, ISO-dated notes,
      # withdrawal tables, COUNT_HISTORY) because rewriting a record to match
      # today turns it into a lie.
      - name: prose counts match the responder
        run: |
          set +e
          python3 scripts/sync_counts.py --check
          code=$?
          set -e
          if [ "$code" = "1" ]; then
            echo "::error::prose counts drifted. Run: python3 scripts/sync_counts.py --write"
          fi
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; counts not asserted this run"
            exit 0
          fi
          exit $code

      # outputSchema is the only descriptor field that binds RUNTIME behaviour:
      # declare one and every successful call owes conforming structuredContent.
      # A unit test can only check the schema is well-formed; it took a live
      # call to find that emem_echo_verify declared `drift` as a string and
      # returned null on every exact match, violating its own schema on the
      # most common path. Same warn-on-unreachable rule as the counts gate.
      - name: declared output schemas are honoured live
        run: |
          python3 -m pip install --quiet jsonschema
          set +e
          python3 scripts/output_schema_conformance.py --check
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; schemas not asserted this run"
            exit 0
          fi
          exit $code

  mcp-host-compat:
    name: MCP hosts can see and call us
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # scripts/mcp_host_compat.py asserts that AWS, Glama, Smithery,
      # Anthropic and OpenAI shaped clients can each discover the endpoint
      # and get an answer out of it: the CORS preflight, the Accept header
      # each one sends, the tools/list page size, and the discovery files
      # that have to point at the same URL the responder answers on. It has
      # been at 25 pass, 0 fail for as long as anyone ran it, which was only
      # ever by hand. Nothing referenced it here, so a regression in any of
      # those five paths would have reached a host before it reached a test.
      #
      # It reads repo files as well as the origin, hence the checkout: half
      # of what it compares is server.json and .well-known/mcp.json against
      # what the live endpoint says.
      #
      # Same exit-code contract as the counts and schema gates above: 2 is
      # "the harness could not run", which a deploy window produces and which
      # must not redden an unrelated pull request; 1 is a real divergence.
      #
      # Worth stating plainly: a job that warns when it cannot reach the
      # origin cannot tell "our endpoint is fine" from "GitHub could not get
      # to it". A green run here is weaker evidence than the same command run
      # by hand from a machine that reached us, and it is not a substitute
      # for one after a deploy.
      - name: five host shapes can reach and call the endpoint
        run: |
          set +e
          python3 scripts/mcp_host_compat.py --check --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; host compatibility not asserted this run"
            exit 0
          fi
          exit $code

  # Two gates that check a RUNNING system rather than the source. Both are
  # here because the failures they catch are invisible to every other job:
  # the code is correct, the tests are green, and the thing an agent talks
  # to still misbehaves.
  guard-conformance:
    name: guard deployment conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the guard
        run: cargo build --release -p emem-guard
      # Against a real socket, because that is where the failures live. The
      # first run of this suite found that a 9 MB body returned 413: axum's
      # DefaultBodyLimit of 2 MB wins over the tower-http layer set to 10 MB,
      # so a server that documented 10 MB, carried the layer, and passed every
      # unit test still refused. Unit tests drive the router directly and
      # never send a body that large, so only this could have caught it.
      # Start, check and audit in ONE step. Splitting them across steps would
      # rely on a backgrounded process surviving between shells, which is
      # true on this runner today and is not a thing to depend on: the
      # failure mode is a green build that never started a server.
      - name: start a node, conform, and audit its log
        run: |
          set -euo pipefail
          ./target/release/emem-guard --data ./var/ci-guard --bind 127.0.0.1:8099 \
            --module secret-patterns &
          node=$!
          # Kill it however this step ends, so a failure cannot leave a
          # process holding the port for whatever runs next.
          trap 'kill "$node" 2>/dev/null || true' EXIT
          up=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/health >/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "the node never came up"; exit 1; fi
          ./target/release/emem-guard --conformance http://127.0.0.1:8099
          # The log it just wrote has to audit clean, or the evidence half of
          # the product is broken in exactly the way nobody would notice.
          ./target/release/emem-guard --audit --data ./var/ci-guard
          # And a module that was loaded has to actually be loaded, or the
          # conformance run proved something about a bare node instead.
          curl -sf http://127.0.0.1:8099/modules \
            | grep -q '"id":"secret-patterns"' \
            || { echo "the module was not loaded"; exit 1; }

  parity:
    name: MCP and REST answer the same
    runs-on: ubuntu-latest
    # 86 cases at two round trips each, six at a time. Fifteen minutes was not
    # enough sequentially and the job was killed mid-run, which GitHub reports
    # as `cancelled` and is indistinguishable at a glance from a job somebody
    # stopped on purpose.
    timeout-minutes: 25
    # A live check against production, so it cannot gate a pull request from
    # a fork and must not fail the build when the network is the problem. It
    # runs on push to main and on a schedule; `continue-on-error` is
    # deliberately ABSENT, because a real divergence should stop the line.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # emem answers on two surfaces from one set of handlers. Two audit
      # rounds found flags that meant different things on each: an agent's
      # answer depended on which door it used. sgozfgkr built the first cut
      # of this harness and specified what it must assert; this is the CI
      # integration that was owed back.
      #
      # Exit 2 is "could not run" (responder unreachable) and is tolerated:
      # a deploy window is not a divergence. Exit 1 is a real divergence and
      # fails the build.
      # --full enumerates every advertised tool, maps it to its REST twin
      # through the responder's OWN OpenAPI operationIds rather than a naming
      # convention, and cross-products the boolean flags each tool declares.
      # 86 cases against 12 hand-picked ones, and the mapping cannot drift
      # from the routes because it is read from the routes.
      - name: parity matrix against production
        run: |
          set +e
          python3 scripts/parity.py --full --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; parity not asserted this run"
            exit 0
          fi
          exit $code

      # Everything above proves a thing we built still works. This proves an
      # agent that has never heard of emem can find out what we are, decide
      # whether we are relevant, and make a correct first call, from the origin
      # alone. It also executes every served row of the intent registry, so a
      # capability claim cannot rot into prose that no longer matches the code.
      # Counts, routes and homepage figures each have a gate. The sentences
      # that assert what a component is CURRENTLY doing had none, and they rot
      # more quietly, because a count invites checking and "X is untrained
      # today" reads as settled background.
      # Pinned rather than relying on whatever the runner image happens to
      # ship: this step is a cryptography check, and "it worked on the old
      # default node" is not a property to leave to the image.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The browser verifier is the code that tells a person whether a signed
      # fact is genuine. Two ways it fails: it accepts nothing (loud), or it
      # accepts everything / rejects sound receipts (silent, and the second
      # tells users their real data was forged). So the suite asserts both
      # directions against a pinned production receipt, including the stripped
      # inclusion proof that preimage_version 2 exists to catch.
      - name: the browser verifier accepts what is genuine and refuses forgeries
        run: node scripts/verify_core_test.cjs

      - name: state a document asserts is the state we are in
        run: |
          set +e
          python3 scripts/state_claims.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; state claims not asserted"
            exit 0
          fi
          exit $code

      # The agent guide's first screen is what an agent routes on. It is
      # generated from the responder's own intent registry, so a hand edit or
      # a new intent that never reached the guide shows up here rather than in
      # an agent picking a tool for a need we stopped serving.
      - name: the agent guide's first screen matches the registry
        run: |
          set +e
          python3 scripts/gen_decision_layer.py --check --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; decision layer not asserted"
            exit 0
          fi
          exit $code

      - name: an agent starting cold can find us and act
        run: |
          set +e
          python3 scripts/discovery_test.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; discovery not asserted this run"
            exit 0
          fi
          exit $code

  spec-verifier:
    name: the spec's own verifier verifies a real receipt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install blake3 pynacl
      # docs/protocol.md 7.4 publishes a self-contained verifier and calls it
      # "the entire trust-rebinding path". It is the listing third parties
      # copy. 5ci64hps rebuilt it from the segment tables and found it
      # rejected every current receipt: the stream stopped at tag 0x09 and
      # never emitted the v2 MERKLE segment, so it computed the SAME digest as
      # the downgrade attack the spec describes two sections earlier. The
      # published verifier and the attacker agreed with each other and
      # disagreed with the signer.
      #
      # /v1/verifier_spec was right the whole time because it is generated
      # from the signer's constants. Only the prose drifted, in the one
      # document nobody runs. So run it.
      - name: run the published listing against a live receipt
        run: |
          set +e
          python3 scripts/spec_verifier_check.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; the spec verifier was not exercised"
            exit 0
          fi
          exit $code

  route-truth:
    name: every route the site shows answers where it is shown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The /guard page shipped a nine-route table where seven answered 404 on
      # emem.dev. Nothing was false (the table describes a self-hosted node)
      # and it still overclaimed, because a reader stands on emem.dev and tries
      # the first thing they see. u4aaoieq found it by doing exactly that.
      #
      # This is the no-hardcoded-numbers rule generalised to routes: no number
      # on the site that is not fetched from the node, and no route on the site
      # that is not reachable where it is shown.
      - name: route truth
        run: |
          set +e
          python3 scripts/route_truth.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; route truth not asserted this run"
            exit 0
          fi
          exit $code
      # The source can describe a route the responder does not serve yet: that
      # is a build nobody deployed, and it reads to an agent exactly like a
      # route that was never written. Only checkable against a live origin.
      - name: openapi is deployed, not just written
        run: |
          set +e
          python3 scripts/openapi_coverage.py --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; deployment not asserted this run"
            exit 0
          fi
          exit $code

  ts-sdk:
    name: TypeScript SDK build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install deps
        working-directory: sdks/emem-ts
        run: npm install --no-audit --no-fund
      # No job ever compiled this package, so three errors under `strict` +
      # `exactOptionalPropertyTypes` survived in a package advertised as
      # releasable. `tsc` also emits a full dist/ while erroring, so a green
      # artefact directory proves nothing; only the exit code does.
      - name: typecheck
        working-directory: sdks/emem-ts
        run: npx tsc --noEmit
      # package.json and src/version.ts are two hand-written copies of one
      # string, and they had already drifted three ways (1.0.0 / 0.0.9 /
      # 0.0.8) with nothing comparing them. The publish workflow checks this
      # too, but at publish time the bad version is already the thing you
      # are shipping. Catch the skew on the PR that introduces it.
      - name: package.json and VERSION agree
        working-directory: sdks/emem-ts
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          SRC=$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/VERSION = \"([^\"]+)\"/)[1]")
          echo "package.json=$PKG src/version.ts=$SRC"
          if [ "$PKG" != "$SRC" ]; then
            echo "::error::version skew: package.json says $PKG, src/version.ts says $SRC"
            exit 1
          fi

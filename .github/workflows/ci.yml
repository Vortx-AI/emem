name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run for the same ref when a new commit lands, so a
# wedged job (see the macOS cache note below) never keeps burning a runner
# after it has been superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The /docs/ site is rendered at build time by mdbook and baked into the
  # signed binary via `include_dir!("docs/book")` in emem-api-rest. The
  # output is gitignored, so every CI job that compiles emem-api-rest must
  # build the book first. Pinned to a known-good version.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install protoc (lance build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Hard cap so a wedged post-run (cache save / process reaping) can't run
    # to GitHub's 6h ceiling. The cold macOS release build (lance/arrow,
    # ort/ONNX, no target cache) measured 70.9 min on the last green main
    # run and got cancelled at a 60-min cap on 2026-07-11, so the cap is
    # sized from that measurement plus headroom, not from optimism.
    timeout-minutes: 90
    # macOS test is BLOCKING again (was temporarily non-blocking). A GitHub
    # macOS image/Xcode update had broken linking of the `ort` (ONNX
    # Runtime) prebuilt static lib against the clang runtime — `ld: library
    # 'clang_rt.osx' not found` — failing every ort-linked binary at LINK
    # time regardless of source. The "macOS clang_rt link path" step below
    # locates libclang_rt.osx.a under the active toolchain and adds it to
    # the linker search path; with that in place the macOS suite links and
    # passes (verified green on eff7754), so the gate is restored. If a
    # future runner image moves the lib, that step logs "not found" and the
    # link failure surfaces here loudly rather than being masked.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The macOS release target/ is multi-GB (lance/arrow, ort/ONNX);
          # its post-job cache save could stall for a very long time on the
          # slower macOS runners, which is the wedge the job-level
          # timeout-minutes now also backstops. Skip target caching on macOS,
          # and only save the cache from main so PR runs never pay the upload.
          cache-targets: ${{ matrix.os != 'macos-latest' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install protoc (lance build scripts, ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (lance build scripts, macos)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf
      - name: macOS clang_rt link path (ort link fix)
        if: matrix.os == 'macos-latest'
        # A GitHub macOS image / Xcode update left the linker unable to
        # find libclang_rt.osx.a (the `ort` ONNX-Runtime prebuilt links the
        # clang runtime; ld: library 'clang_rt.osx' not found). Locate it
        # under the active toolchain and add its directory to the linker
        # search path so the ort-linked test binaries link. Best-effort: if
        # it isn't found we leave RUSTFLAGS unchanged and the link failure
        # surfaces in the (now blocking) test step rather than being masked.
        run: |
          RT=$(find "$(xcode-select -p)" /Library/Developer/CommandLineTools \
                 -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          if [ -n "$RT" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS} -L $(dirname "$RT")" >> "$GITHUB_ENV"
            echo "added clang_rt search path: $(dirname "$RT")"
          else
            echo "libclang_rt.osx.a not found under the active toolchain"
          fi
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo test --workspace --release

  msrv:
    name: minimum supported rust 1.91
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: install protoc (lance build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo build --workspace

  # Surfaces RustSec advisories for our transitive deps. Fails only on
  # actual `vulnerability` advisories; informational findings
  # (e.g. sled is implicitly unmaintained — tracked, migration to redb
  # is on the deferred punch list) are reported but don't block the
  # build. We re-evaluate the ignore list whenever the advisory db
  # adds something. Plain `cargo audit` rather than the
  # `rustsec/audit-check` action because the action posts a GitHub
  # check-run, which requires `checks: write` we don't otherwise need.
  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        # Plain `cargo audit` exits non-zero only on `vulnerability`
        # findings; informational warnings (unmaintained, yanked,
        # notice) are surfaced in the log but don't fail CI.
        run: cargo audit

  python-sdks:
    name: python SDK tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the package floor (declared in pyproject.toml); 3.12
        # catches warnings from newer interpreter behaviour. These two
        # bracket the supported range.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "pytest>=8.0" "respx>=0.21" "langchain-core>=0.3,<1.0"
      - name: emem-py parity tests
        run: PYTHONPATH=sdks/emem-py/src python -m pytest sdks/emem-py/tests/ -v
      - name: emem-langmem smoke tests
        run: PYTHONPATH=sdks/emem-langmem/src python -m pytest sdks/emem-langmem/tests/ -v

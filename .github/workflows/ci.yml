name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel an in-flight run for the same ref when a new commit lands, so a
# wedged job (see the macOS cache note below) never keeps burning a runner
# after it has been superseded.
concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on branches and PRs, never on main.
  #
  # On a branch this saves an hour of runners when you push three times
  # while iterating, and the only signal lost is about a commit nobody
  # will look at again. On main it destroys the signal itself: the badge
  # reports the newest CONCLUSIVE run, and a cancelled run is not one, so
  # a stretch of quick pushes leaves the badge pinned to whatever the last
  # completed run said. On 2026-08-05 that meant main read "failing" for
  # seven hours and eight commits after the failure had been fixed, because
  # every run that would have proved it green was killed by the next push.
  #
  # Correctness of the badge is worth more than the runner minutes: a red
  # badge nobody trusts is the same as no badge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The /docs/ site is rendered at build time by mdbook and baked into the
  # signed binary via `include_dir!("docs/book")` in emem-api-rest. The
  # output is gitignored, so every CI job that compiles emem-api-rest must
  # build the book first. Pinned to a known-good version.
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install protoc (lance build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Hard cap so a wedged post-run (cache save / process reaping) can't run
    # to GitHub's 6h ceiling. The cold macOS release build (lance/arrow,
    # ort/ONNX, no target cache) measured 70.9 min on the last green main
    # run and got cancelled at a 60-min cap on 2026-07-11, so the cap is
    # sized from that measurement plus headroom, not from optimism.
    #
    # Re-sized 2026-07-15, same reasoning against a newer measurement. The
    # macOS job had grown into its own cap: 86.1 min on the last green main
    # run (5d38a95) against a 90-min limit is 4 min of headroom, and the next
    # push (db9d663) took 90.5 min and was cancelled at the cap. Ubuntu over
    # the same pair moved 30.2 -> 29.4 min, so this is the cold macOS build
    # drifting plus runner variance, not a test that got slower: a 96%-full
    # cap fails on whichever commit happens to draw a slow runner, which
    # reads as "your change broke CI" and is not true. Per-OS now, because
    # one number cannot be both a real backstop for ubuntu (~30 min) and
    # honest headroom for macOS (~90).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 120 || 60 }}
    # macOS test is BLOCKING again (was temporarily non-blocking). A GitHub
    # macOS image/Xcode update had broken linking of the `ort` (ONNX
    # Runtime) prebuilt static lib against the clang runtime — `ld: library
    # 'clang_rt.osx' not found` — failing every ort-linked binary at LINK
    # time regardless of source. The "macOS clang_rt link path" step below
    # locates libclang_rt.osx.a under the active toolchain and adds it to
    # the linker search path; with that in place the macOS suite links and
    # passes (verified green on eff7754), so the gate is restored. If a
    # future runner image moves the lib, that step logs "not found" and the
    # link failure surfaces here loudly rather than being masked.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The macOS release target/ is multi-GB (lance/arrow, ort/ONNX);
          # its post-job cache save could stall for a very long time on the
          # slower macOS runners, which is the wedge the job-level
          # timeout-minutes now also backstops. Skip target caching on macOS,
          # and only save the cache from main so PR runs never pay the upload.
          cache-targets: ${{ matrix.os != 'macos-latest' }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: install protoc (lance build scripts, ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: install protoc (lance build scripts, macos)
        if: matrix.os == 'macos-latest'
        run: brew install protobuf
      - name: macOS clang_rt link path (ort link fix)
        if: matrix.os == 'macos-latest'
        # A GitHub macOS image / Xcode update left the linker unable to
        # find libclang_rt.osx.a (the `ort` ONNX-Runtime prebuilt links the
        # clang runtime; ld: library 'clang_rt.osx' not found). Locate it
        # under the active toolchain and add its directory to the linker
        # search path so the ort-linked test binaries link. Best-effort: if
        # it isn't found we leave RUSTFLAGS unchanged and the link failure
        # surfaces in the (now blocking) test step rather than being masked.
        run: |
          RT=$(find "$(xcode-select -p)" /Library/Developer/CommandLineTools \
                 -name 'libclang_rt.osx.a' 2>/dev/null | head -1)
          if [ -n "$RT" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS} -L $(dirname "$RT")" >> "$GITHUB_ENV"
            echo "added clang_rt search path: $(dirname "$RT")"
          else
            echo "libclang_rt.osx.a not found under the active toolchain"
          fi
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo test --workspace --release

  msrv:
    name: minimum supported rust 1.91
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91
      - uses: Swatinem/rust-cache@v2
      - name: install protoc (lance build scripts)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: '0.5.2'
      - run: mdbook build docs && rm -f docs/book/book.toml
      - run: cargo build --workspace

  # Surfaces RustSec advisories for our transitive deps. Fails only on
  # actual `vulnerability` advisories; informational findings
  # (e.g. sled is implicitly unmaintained — tracked, migration to redb
  # is on the deferred punch list) are reported but don't block the
  # build. We re-evaluate the ignore list whenever the advisory db
  # adds something. Plain `cargo audit` rather than the
  # `rustsec/audit-check` action because the action posts a GitHub
  # check-run, which requires `checks: write` we don't otherwise need.
  audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install --locked cargo-audit
      - name: cargo audit
        # Plain `cargo audit` exits non-zero only on `vulnerability`
        # findings; informational warnings (unmaintained, yanked,
        # notice) are surfaced in the log but don't fail CI.
        run: cargo audit

  python-sdks:
    name: python SDK tests (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the package floor (declared in pyproject.toml); 3.12
        # catches warnings from newer interpreter behaviour. These two
        # bracket the supported range.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "httpx>=0.27" "pytest>=8.0" "respx>=0.21" "langchain-core>=0.3,<1.0" "blake3>=0.3" "cryptography>=41"
      - name: emem-py parity tests
        run: PYTHONPATH=sdks/emem-py/src python -m pytest sdks/emem-py/tests/ -v
      - name: emem-langmem smoke tests
        run: PYTHONPATH=sdks/emem-langmem/src python -m pytest sdks/emem-langmem/tests/ -v
      # The two steps above put src/ on PYTHONPATH, so they pass whether or
      # not the built package contains any code. ememdev 1.0.0 shipped to
      # PyPI holding nothing but metadata, and this suite stayed green
      # through it. Build the artefact and import it out of a wheel, which
      # is the thing users actually install.
      - name: wheels contain their modules
        run: |
          python -m pip install --upgrade build
          for sdk in emem-py emem-langmem; do
            python -m build --wheel --outdir "dist-$sdk" "sdks/$sdk"
          done
          python - <<'PY'
          import glob, sys, zipfile

          failed = False
          for whl in sorted(glob.glob("dist-*/*.whl")):
              modules = [n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".py")]
              print(f"{whl}: {len(modules)} module(s)")
              if not modules:
                  print(f"  ERROR: {whl} ships no Python modules", file=sys.stderr)
                  failed = True
          sys.exit(1 if failed else 0)
          PY
      - name: an installed wheel imports
        run: |
          python -m venv /tmp/wheelcheck
          /tmp/wheelcheck/bin/pip install --quiet dist-emem-py/*.whl
          /tmp/wheelcheck/bin/python -c "import ememdev; print('ememdev', ememdev.__version__)"
          /tmp/wheelcheck/bin/pip install --quiet "langchain-core>=0.3,<1.0" "blake3>=0.3" "cryptography>=41"
          /tmp/wheelcheck/bin/pip install --quiet dist-emem-langmem/*.whl
          /tmp/wheelcheck/bin/python -c "import emem_langmem; print('emem_langmem', emem_langmem.__version__)"

  whitepaper:
    name: whitepaper HTML matches its markdown
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # web/whitepaper-v2.html is generated from docs/whitepaper-v2.md and
      # baked into the binary with include_str!, so a stale commit ships a
      # page that contradicts its own source. That is exactly how v1's two
      # hand-written copies drifted apart.
      - name: rendered page is up to date
        run: python3 scripts/render_whitepaper.py --check

  doc-lint:
    name: prose convention holds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The convention CONTRIBUTING.md states, enforced instead of
      # remembered: no em/en dashes (legacy files ride a burn-down list
      # inside the script), no AGI-family vocabulary, no buzzword tells,
      # and every relative doc link resolving. Judgment calls stay with
      # review; this holds the mechanical floor.
      - name: doc lint
        run: python3 scripts/doc_lint.py

  # Two gates that check a RUNNING system rather than the source. Both are
  # here because the failures they catch are invisible to every other job:
  # the code is correct, the tests are green, and the thing an agent talks
  # to still misbehaves.
  guard-conformance:
    name: guard deployment conformance
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build the guard
        run: cargo build --release -p emem-guard
      # Against a real socket, because that is where the failures live. The
      # first run of this suite found that a 9 MB body returned 413: axum's
      # DefaultBodyLimit of 2 MB wins over the tower-http layer set to 10 MB,
      # so a server that documented 10 MB, carried the layer, and passed every
      # unit test still refused. Unit tests drive the router directly and
      # never send a body that large, so only this could have caught it.
      # Start, check and audit in ONE step. Splitting them across steps would
      # rely on a backgrounded process surviving between shells, which is
      # true on this runner today and is not a thing to depend on: the
      # failure mode is a green build that never started a server.
      - name: start a node, conform, and audit its log
        run: |
          set -euo pipefail
          ./target/release/emem-guard --data ./var/ci-guard --bind 127.0.0.1:8099 \
            --module secret-patterns &
          node=$!
          # Kill it however this step ends, so a failure cannot leave a
          # process holding the port for whatever runs next.
          trap 'kill "$node" 2>/dev/null || true' EXIT
          up=""
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8099/health >/dev/null; then up=1; break; fi
            sleep 1
          done
          if [ -z "$up" ]; then echo "the node never came up"; exit 1; fi
          ./target/release/emem-guard --conformance http://127.0.0.1:8099
          # The log it just wrote has to audit clean, or the evidence half of
          # the product is broken in exactly the way nobody would notice.
          ./target/release/emem-guard --audit --data ./var/ci-guard
          # And a module that was loaded has to actually be loaded, or the
          # conformance run proved something about a bare node instead.
          curl -sf http://127.0.0.1:8099/modules \
            | grep -q '"id":"secret-patterns"' \
            || { echo "the module was not loaded"; exit 1; }

  parity:
    name: MCP and REST answer the same
    runs-on: ubuntu-latest
    # 86 cases at two round trips each, six at a time. Fifteen minutes was not
    # enough sequentially and the job was killed mid-run, which GitHub reports
    # as `cancelled` and is indistinguishable at a glance from a job somebody
    # stopped on purpose.
    timeout-minutes: 25
    # A live check against production, so it cannot gate a pull request from
    # a fork and must not fail the build when the network is the problem. It
    # runs on push to main and on a schedule; `continue-on-error` is
    # deliberately ABSENT, because a real divergence should stop the line.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # emem answers on two surfaces from one set of handlers. Two audit
      # rounds found flags that meant different things on each: an agent's
      # answer depended on which door it used. sgozfgkr built the first cut
      # of this harness and specified what it must assert; this is the CI
      # integration that was owed back.
      #
      # Exit 2 is "could not run" (responder unreachable) and is tolerated:
      # a deploy window is not a divergence. Exit 1 is a real divergence and
      # fails the build.
      # --full enumerates every advertised tool, maps it to its REST twin
      # through the responder's OWN OpenAPI operationIds rather than a naming
      # convention, and cross-products the boolean flags each tool declares.
      # 86 cases against 12 hand-picked ones, and the mapping cannot drift
      # from the routes because it is read from the routes.
      - name: parity matrix against production
        run: |
          set +e
          python3 scripts/parity.py --full --origin "${EMEM_ORIGIN:-https://emem.dev}"
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "::warning::the responder did not answer; parity not asserted this run"
            exit 0
          fi
          exit $code

  ts-sdk:
    name: TypeScript SDK build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install deps
        working-directory: sdks/emem-ts
        run: npm install --no-audit --no-fund
      # No job ever compiled this package, so three errors under `strict` +
      # `exactOptionalPropertyTypes` survived in a package advertised as
      # releasable. `tsc` also emits a full dist/ while erroring, so a green
      # artefact directory proves nothing; only the exit code does.
      - name: typecheck
        working-directory: sdks/emem-ts
        run: npx tsc --noEmit
      # package.json and src/version.ts are two hand-written copies of one
      # string, and they had already drifted three ways (1.0.0 / 0.0.9 /
      # 0.0.8) with nothing comparing them. The publish workflow checks this
      # too, but at publish time the bad version is already the thing you
      # are shipping. Catch the skew on the PR that introduces it.
      - name: package.json and VERSION agree
        working-directory: sdks/emem-ts
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          SRC=$(node -p "require('fs').readFileSync('src/version.ts','utf8').match(/VERSION = \"([^\"]+)\"/)[1]")
          echo "package.json=$PKG src/version.ts=$SRC"
          if [ "$PKG" != "$SRC" ]; then
            echo "::error::version skew: package.json says $PKG, src/version.ts says $SRC"
            exit 1
          fi

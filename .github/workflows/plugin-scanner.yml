name: plugin-scanner

# The HOL plugin scanner grades this repository for the registries that list
# the emem plugin (hol.org). Run here, its findings reach us at the commit that
# causes them, not weeks later on a registry page. A separate workflow from
# `ci` on purpose: the gated deploy refuses on any failed `ci` job, and a
# scanner rule change upstream must not stop a server deploy.

on:
  push:
    # scanner-check/** runs the scanner alone on a branch, so a change to the
    # skills or this workflow can be graded without a push to main (which
    # starts ci, publish and a deploy).
    branches: [main, "scanner-check/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  # report_to_hol proves to HOL, with a GitHub OIDC token, that the summary
  # below came from this repository's CI. It sends the score, grade, finding
  # counts, scanner version, commit and run: never code or finding text.
  id-token: write

concurrency:
  group: plugin-scanner-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  scan:
    name: HOL plugin scanner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashgraph-online/ai-plugin-scanner-action@9b169fc65d09b24726b66d70b3563ab563158b58 # v1.2.816
        with:
          plugin_dir: "."
          mode: scan
          format: json
          output: plugin-scan.json
          fail_on_severity: high
          write_step_summary: true
          pr_comment: "off"
          # The registry page counts the scanner as maintained in CI only when
          # it receives this report; without it the trust score loses 10 %.
          report_to_hol: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The job summary shows only to a signed-in reader and the log API needs a
      # token, so the first failed run said only "exit code 1" to anyone else.
      # Annotations on the check run are public: each finding becomes one.
      - name: findings as annotations
        if: always()
        run: |
          python3 - plugin-scan.json <<'PY'
          import json, sys
          try:
              report = json.load(open(sys.argv[1], encoding="utf-8"))
          except (OSError, ValueError) as e:
              print(f"::notice title=plugin scan::no JSON report ({e})")
              sys.exit(0)
          # scan-result.v1: findings carry ruleId / filePath / lineNumber.
          findings = report.get("findings") or []
          head = {k: report.get(k) for k in ("score", "grade", "profile", "policy_pass")}
          print(f"::notice title=plugin scan::{len(findings)} findings {head} counts={report.get('summary', {}).get('findings')}")
          for c in report.get("categories") or []:
              for ch in c.get("checks") or []:
                  if not ch.get("passed"):
                      print(f"::notice title=check failed::{c.get('name')} / {ch.get('name')}: {ch.get('points')}/{ch.get('maxPoints')} {str(ch.get('message', ''))[:300]}")
          for f in findings[:40]:
              sev = str(f.get("severity", "")).lower()
              level = "error" if sev in ("critical", "high") else "warning" if sev == "medium" else "notice"
              where = f.get("filePath") or ""
              if f.get("lineNumber"):
                  where += f":{f.get('lineNumber')}"
              text = f"{f.get('ruleId')} ({sev}) {where}: {f.get('title', '')}. {f.get('description', '')}"
              print(f"::{level} title={f.get('ruleId')}::" + text.replace("\r", " ").replace("\n", " ")[:900])
          PY

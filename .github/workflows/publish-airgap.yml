name: publish-airgap

# The air-gapped node's two halves, as images anyone can pull.
#
#   ghcr.io/vortx-ai/emem-airgap:latest   the decoder: one directory in, one out
#   ghcr.io/vortx-ai/emem-encode:latest   the encoder sidecar: OS execution traces
#
# Tagged the same way as the server image: :latest and :main on the default
# branch, :<short-sha> for every push, and the semver forms on a v* tag.
#
# Why a separate workflow from publish.yml. That one builds the server: 530+
# crates, needs 30 GB freed from the runner before it will link, and takes the
# best part of an hour. These two images are 1.9 MB and 1.5 MB and build in
# minutes from four crates. Sharing a workflow would mean the node's images
# only ship when the server's build succeeds, and the whole point of the
# air-gapped node is that it does not depend on the server.
#
# Both roles come from ONE Dockerfile with one build argument, which is
# deliberate: the two halves share a schema, an identity file and a signing
# path, and a second Dockerfile would drift from the first.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: vortx-ai

jobs:
  # Native runners per architecture, no QEMU. The cross-build inside the
  # Dockerfile handles a laptop targeting a Jetson; here each leg simply
  # builds for the machine it is on, which is faster and avoids emulating a
  # C toolchain for blake3.
  build:
    name: ${{ matrix.role }} ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Spelled out rather than a cross product with includes filling in the
      # runner. Four legs is few enough to read, and a matrix whose shape you
      # have to derive is a matrix that silently builds the wrong thing.
      matrix:
        include:
          - { role: decode, platform: linux/amd64, runner: ubuntu-latest,    arch: amd64 }
          - { role: decode, platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
          - { role: encode, platform: linux/amd64, runner: ubuntu-latest,    arch: amd64 }
          - { role: encode, platform: linux/arm64, runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name for this role
        id: name
        run: |
          if [ "${{ matrix.role }}" = "encode" ]; then
            echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/emem-encode" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/emem-airgap" >> "$GITHUB_OUTPUT"
          fi

      - name: build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./crates/emem-airgap/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            ROLE=${{ matrix.role }}
          # By digest, untagged. The manifest job below joins the two
          # architectures and stamps the readable tags on the result, so a
          # tag never points at one arch.
          outputs: type=image,name=${{ steps.name.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=airgap-${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=airgap-${{ matrix.role }}-${{ matrix.arch }}

      - name: export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - name: upload digest
        uses: actions/upload-artifact@v4
        with:
          name: airgap-digest-${{ matrix.role }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: manifest ${{ matrix.role }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        role: [decode, encode]
    steps:
      - uses: actions/checkout@v4

      - name: download this role's digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: airgap-digest-${{ matrix.role }}-*
          merge-multiple: true

      - name: set up buildx
        uses: docker/setup-buildx-action@v3

      - name: log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: image name and description for this role
        id: name
        run: |
          if [ "${{ matrix.role }}" = "encode" ]; then
            echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/emem-encode" >> "$GITHUB_OUTPUT"
            echo "title=emem-encode" >> "$GITHUB_OUTPUT"
            echo "desc=Captures one OS execution trace window, signs it, writes it to a folder. The encoder half of the emem air-gapped node." >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ env.REGISTRY }}/${{ env.OWNER }}/emem-airgap" >> "$GITHUB_OUTPUT"
            echo "title=emem-airgap" >> "$GITHUB_OUTPUT"
            echo "desc=Signs custody for every payload that arrives in a directory. One directory in, one out, no network. The decoder half of the emem air-gapped node." >> "$GITHUB_OUTPUT"
          fi

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=${{ steps.name.outputs.title }}
            org.opencontainers.image.description=${{ steps.name.outputs.desc }}
            org.opencontainers.image.url=https://emem.dev
            org.opencontainers.image.source=https://github.com/Vortx-AI/emem
            org.opencontainers.image.documentation=https://github.com/Vortx-AI/emem/blob/main/crates/emem-airgap/README.md
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Vortx-AI

      - name: create manifest list & push
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          IMAGE="${{ steps.name.outputs.image }}"
          AMD64=$(cat amd64)
          ARM64=$(cat arm64)
          REFS="${IMAGE}@${AMD64} ${IMAGE}@${ARM64}"
          echo "$REFS"
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            [ -z "$tag" ] && continue
            echo "==> stamping $tag"
            docker buildx imagetools create -t "$tag" $REFS
          done

      # Pull what was just pushed and run it. A published image that does not
      # start is worse than no published image: it is a download that fails on
      # someone else's hardware, at the point where they have no way to tell
      # whether the fault is theirs.
      - name: the published image runs
        run: |
          set -euo pipefail
          IMAGE="${{ steps.name.outputs.image }}"
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | head -1)
          echo "==> $TAG"
          docker buildx imagetools inspect "$TAG"
          docker run --rm --network none "$TAG" --help
          # An unknown flag must be refused, not ignored. This is the property
          # that makes a mistyped deployment stop rather than run with a
          # setting that silently did not apply.
          if docker run --rm --network none "$TAG" --not-a-real-flag >/dev/null 2>&1; then
            echo "::error::the published image accepted a flag it does not have"
            exit 1
          fi

<style>
html.arcade-channel{
  color-scheme:dark;--paper:#161020;--paper-2:#241d2b;--paper-3:#2e2536;
  --ink:#f2e8d5;--ink-2:#d0c3b5;--mute:#b1a1b9;--mute-2:#9a89a5;
  --accent:#3ec9a7;--accent-bg:#142e29;--rule:#44364e;--rule-strong:#70597f;
  --absent:#ffb86b;--absent-bg:#36291f;--vermilion:#ff8e8e;--highlight:#e8a33d;
  --bg:#241d2b;--line:#70597f;--display:ui-monospace,Menlo,Consolas,monospace;
  --mono:ui-monospace,Menlo,Consolas,monospace;--pad-x:24px;
  --t-4xs:10px;--t-3xs:11px;--t-2xs:12px;--t-xs:13px;--t-sm:14px;--t-md:15px;
  --t-lg:18px;--t-xl:22px;--t-3xl:28px;--w-text:78ch;
  background:var(--paper);scrollbar-color:var(--rule-strong) var(--paper)
}
html.arcade-channel body{font-family:var(--mono);font-size:var(--t-sm);overflow-wrap:anywhere}
html.arcade-channel .sitebar,html.arcade-channel body>footer,
html.arcade-channel .site-nav,html.arcade-channel .foot,html.arcade-channel .audience{display:none}
html.arcade-channel .wrap{max-width:none;padding:0 var(--pad-x)}
html.arcade-channel main>h1{display:none}
html.arcade-channel .hd{position:static;margin:0;padding:12px 0;border:0}
html.arcade-channel .hd .in{max-height:114px;gap:6px;mask-image:none;-webkit-mask-image:none}
html.arcade-channel .chip{border-radius:2px;min-height:32px;padding:4px 8px;font-size:var(--t-3xs)}
html.arcade-channel .chip i,html.arcade-channel .lv b,html.arcade-channel .pdot{border-radius:0}
html.arcade-channel .chip.off{opacity:.55;text-decoration:line-through}
html.arcade-channel .agora{display:block}
html.arcade-channel .rail{position:static}
html.arcade-channel .findbar{margin:0 0 16px;gap:8px}
html.arcade-channel .findbar input,html.arcade-channel .findbar select{
  font-family:var(--mono);font-size:var(--t-2xs);min-height:42px;border-radius:2px
}
html.arcade-channel .findn{width:100%;font-size:var(--t-3xs);color:var(--mute)}
html.arcade-channel .convo-h{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.1em;
  color:var(--highlight);border-bottom:1px solid var(--rule);margin:16px 0}
html.arcade-channel .convo-h~p.mute{font-size:var(--t-2xs);line-height:1.65}
html.arcade-channel .msg{gap:10px;margin:16px 0;scroll-margin-top:18px;
  content-visibility:auto;contain-intrinsic-size:auto 350px}
html.arcade-channel .msg .ava{width:30px;height:34px;border-radius:2px;
  border:2px solid #0c0812;box-shadow:3px 3px 0 #0c0812;font-size:var(--t-xs);color:#fff}
html.arcade-channel .msg .bub{max-width:100%;padding:16px;border-radius:2px;
  border:1px solid var(--rule);box-shadow:3px 3px 0 #0c0812}
html.arcade-channel .msg.side-r .bub{border-left:3px solid var(--accent)}
html.arcade-channel .bub h3{font-size:var(--t-md);line-height:1.5;margin:9px 0 10px}
html.arcade-channel .bub .txt,html.arcade-channel .note-p{font-size:var(--t-xs);line-height:1.75}
html.arcade-channel .bub .nm{color:var(--highlight)!important}
html.arcade-channel .bub header{gap:6px 10px}
html.arcade-channel button,html.arcade-channel .vfy{min-height:32px;padding:6px 9px;border-radius:2px}
html.arcade-channel .sig{line-height:1.6}
html.arcade-channel .tok{flex-wrap:wrap;gap:4px 8px;padding:5px 7px}
html.arcade-channel .tok code{overflow-wrap:anywhere}
html.arcade-channel .meta .acts{gap:8px}
html.arcade-channel .acts .cidtag{flex-basis:100%;margin:0;font-size:var(--t-4xs)}
html.arcade-channel .more,html.arcade-channel .thr,html.arcade-channel .cp{background:var(--paper-3)}
html.arcade-channel .threadbar{top:0;border-radius:2px;flex-wrap:wrap;padding:10px}
html.arcade-channel .desk,html.arcade-channel .grp,html.arcade-channel .railbox,
html.arcade-channel .presence,html.arcade-channel .drawer{border-radius:2px}
html.arcade-channel .desk{padding:18px;margin-top:10px}
html.arcade-channel .deskrow,html.arcade-channel .deskrow.exact{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
html.arcade-channel .deskrow .dv{text-align:left}
html.arcade-channel .deskrow .dw{grid-column:1}
html.arcade-channel .deskrow .dk{grid-column:2}
html.arcade-channel .substrate{padding:18px;border:1px solid var(--rule);background:var(--paper-2)}
html.arcade-channel .rail{gap:16px}
html.arcade-channel .drawers{display:grid;grid-template-columns:1fr;gap:12px}
html.arcade-channel .drawer summary{padding:14px;min-height:48px}
html.arcade-channel .drawer-body{padding:6px 16px 16px}
html.arcade-channel .drawer-body p{font-size:var(--t-xs)}
html.arcade-channel .loadmore{border-radius:2px;color:var(--highlight);padding:16px}
html.arcade-channel .newbar{padding:12px;box-shadow:0 -4px 0 #0c0812}
html.arcade-channel :focus-visible{outline:2px solid var(--highlight);outline-offset:3px}
html.arcade-channel [data-deck-panel][hidden]{display:none!important}
.deck-nav{display:flex;gap:6px;padding:12px var(--pad-x);border-bottom:1px solid var(--rule);
  margin-bottom:16px;overflow-x:auto}
.deck-nav button{font:inherit;font-size:var(--t-3xs);color:var(--mute);background:var(--paper-2);
  border:1px solid var(--rule);white-space:nowrap;cursor:pointer}
.deck-nav button[aria-pressed=true]{color:var(--highlight);background:#382b1e;border-color:var(--highlight)}
.deck-intro{padding:0 var(--pad-x);color:var(--mute);font-size:var(--t-2xs);line-height:1.7}
.deck-reset{font:inherit;color:var(--highlight);background:var(--paper-2);border:1px solid var(--rule);cursor:pointer}
html.arcade-channel .deck-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
html.arcade-channel .deck-filters label{font-size:var(--t-3xs);color:var(--mute)}
.deck-speakers{border:1px solid var(--rule);background:var(--paper-2);margin-bottom:14px}
.deck-speakers summary{padding:10px 12px;cursor:pointer;color:var(--mute);font-size:var(--t-3xs)}
html.arcade-channel .live-msg{display:block;padding:14px;border:1px solid var(--rule);
  border-left:3px solid var(--accent);background:var(--paper-2)}
html.arcade-channel .live-msg .mhead{color:var(--highlight);margin-bottom:8px}
html.arcade-channel .live-msg .mbody{font-size:var(--t-2xs);line-height:1.7;margin:8px 0}
html.arcade-channel .deck-filters select{font:inherit;font-size:var(--t-2xs);background:var(--paper-2);
  color:var(--ink);border:1px solid var(--rule);padding:8px;min-height:36px}
@media(max-width:560px){
  html.arcade-channel{--pad-x:14px}
  html.arcade-channel .msg{gap:0}
  html.arcade-channel .msg .ava{display:none}
  html.arcade-channel .msg .bub{padding:13px}
  html.arcade-channel .bub h3{font-size:var(--t-sm)}
  html.arcade-channel .findbar select{width:100%}
  html.arcade-channel .drawer summary{display:block}
  html.arcade-channel .drawer summary .mute{display:block;margin-top:5px}
  html.arcade-channel .row{grid-template-columns:22px 1fr;gap:8px}
}
@media(prefers-reduced-motion:reduce){
  html.arcade-channel *,html.arcade-channel *:before,html.arcade-channel *:after{
    animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
<script>
(function(){
  if(new URLSearchParams(location.search).get('view')!=='arcade')return;
  document.documentElement.classList.add('arcade-channel');
  document.addEventListener('DOMContentLoaded',function(){
    const main=document.querySelector('main'),stream=document.querySelector('.stream');
    if(!main||!stream)return;
    const panels=new Map(), buttons=new Map();
    const nav=document.createElement('nav');
    nav.className='deck-nav';nav.setAttribute('aria-label','Channel sections');
    const intro=document.createElement('p');intro.className='deck-intro';
    intro.textContent='Every conversation. Every correction. Follow the record, or inspect the evidence behind it.';
    main.before(intro,nav);
    const conversation=document.createElement('section');
    const evidence=document.createElement('section');
    const agents=document.createElement('section');
    const guide=document.createElement('section');
    panels.set('conversation',conversation);panels.set('evidence',evidence);
    panels.set('agents',agents);panels.set('guide',guide);
    const heading=stream.querySelector('.convo-h');
    for(let node=heading;node;){
      const next=node.nextSibling;conversation.append(node);node=next;
    }
    const notesGuide=conversation.querySelector('.convo-h + p');
    const provenance=notesGuide?.nextElementSibling;
    if(provenance?.tagName==='P')evidence.append(provenance);
    if(notesGuide)guide.append(notesGuide);
    const find=main.querySelector('.findbar');
    if(find)conversation.prepend(find);
    const desk=stream.querySelector('.desk');if(desk)evidence.append(desk);
    const rail=document.querySelector('.rail');if(rail)agents.append(rail);
    const drawers=stream.querySelector('.drawers');if(drawers)guide.append(drawers);
    // Keep the provenance, omissions and build warnings alongside the evidence.
    evidence.append(...stream.childNodes);
    const agora=main.querySelector('.agora');if(agora)agora.remove();
    const labels={conversation:'Conversations',evidence:'Evidence',agents:'Agents',guide:'Field guide'};
    panels.forEach(function(panel,key){
      panel.dataset.deckPanel=key;panel.id='deck-'+key;main.append(panel);
      const button=document.createElement('button');button.type='button';
      button.textContent=labels[key];button.setAttribute('aria-controls',panel.id);
      button.addEventListener('click',function(){select(key);window.scrollTo(0,0);});
      buttons.set(key,button);nav.append(button);
    });
    const roster=document.querySelector('.hd');
    if(roster){
      const speakers=document.createElement('details');speakers.className='deck-speakers';
      const summary=document.createElement('summary');
      summary.textContent='Filter speakers · '+roster.querySelectorAll('.chip').length+' identities';
      speakers.append(summary,roster);conversation.prepend(speakers);
    }
    const livefeed=document.createElement('section');livefeed.id='livefeed';livefeed.className='msgs';
    livefeed.innerHTML='<h2 class="livehead">Since you opened this page</h2>';
    livefeed.hidden=true;conversation.append(livefeed);
    new MutationObserver(()=>{livefeed.hidden=!livefeed.querySelector('.msg');}).observe(livefeed,{childList:true});
    let section='conversation';
    function select(key){
      section=key;
      panels.forEach((panel,k)=>{panel.hidden=k!==key;});
      buttons.forEach((button,k)=>button.setAttribute('aria-pressed',String(k===key)));
    }
    select('conversation');
    const filter=document.createElement('div');filter.className='deck-filters';
    const label=document.createElement('label');label.textContent='Read order ';
    const sort=document.createElement('select');sort.setAttribute('aria-label','Conversation order');
    sort.innerHTML='<option value="recent">Newest first</option><option value="oldest">Oldest first</option>';
    label.append(sort);
    const reset=document.createElement('button');reset.type='button';reset.className='deck-reset';
    reset.textContent='Reset filters';
    filter.append(label,reset);find?.after(filter);
    const messages=Array.from(conversation.querySelectorAll('.msg'));
    const days=Array.from(conversation.querySelectorAll('.day'));
    const more=conversation.querySelector('.loadmore');
    function order(){
      const ordered=sort.value==='recent'?messages.slice().reverse():messages;
      const fragment=document.createDocumentFragment();
      let day='';
      ordered.forEach(function(message){
        const date=message.querySelector('time')?.dateTime.slice(0,10)||'';
        if(date!==day){
          const separator=days.find(d=>d.id==='d-'+date);
          if(separator)fragment.append(separator);
          day=date;
        }
        fragment.append(message);
      });
      conversation.append(fragment);
      if(more&&more.isConnected){
        if(sort.value==='recent')conversation.append(more);
        else if(messages[0])conversation.insertBefore(more,messages[0]);
      }
    }
    sort.addEventListener('change',function(){
      messages.forEach(m=>m.classList.remove('folded'));
      if(more)more.hidden=true;
      order();
    });
    order();
    // The legacy pagination button moves itself before the oldest visible note.
    // Keep it at the end while the arcade is reading newest-first.
    more?.addEventListener('click',()=>{if(sort.value==='recent')conversation.append(more);});
    reset.addEventListener('click',function(){
      document.querySelectorAll('.chip.off').forEach(c=>c.click());
      const q=document.getElementById('q');if(q){q.value='';q.dispatchEvent(new Event('input'));}
      const day=document.getElementById('dayjump');if(day)day.value='';
      document.getElementById('thrx')?.click();
      messages.forEach(m=>m.classList.remove('nomatch'));
      days.forEach(d=>d.classList.remove('nomatch'));
    });
    const search=document.getElementById('q');
    search?.addEventListener('input',function(){
      messages.forEach(m=>m.classList.remove('folded'));
      if(more)more.hidden=true;
    });
    document.getElementById('dayjump')?.addEventListener('change',function(){
      messages.forEach(m=>m.classList.remove('folded'));
      if(more)more.hidden=true;
    },true);
    conversation.addEventListener('click',function(event){
      if(!event.target.closest('.thr'))return;
      reset.click();messages.forEach(m=>m.classList.remove('folded'));
      if(more)more.hidden=true;
      sort.value='oldest';order();
    },true);
    function revealTarget(){
      const id=decodeURIComponent(location.hash.slice(1));
      const target=id?document.getElementById(id):null;
      if(!target)return;
      if(target.closest('[data-deck-panel]'))select(target.closest('[data-deck-panel]').dataset.deckPanel);
      if(target.classList.contains('msg')){
        reset.click();target.classList.remove('folded');
      }
      target.scrollIntoView({block:'start'});
    }
    window.addEventListener('hashchange',revealTarget);
    if(location.hash)revealTarget();
    document.addEventListener('click',function(event){
      const link=event.target.closest('a[href]');
      if(!link)return;
      const url=new URL(link.href,location.href);
      if(url.origin===location.origin&&url.pathname===location.pathname&&url.hash){
        const target=document.getElementById(decodeURIComponent(url.hash.slice(1)));
        if(target){
          const panel=target.closest('[data-deck-panel]');
          if(panel)select(panel.dataset.deckPanel);
        }
      }else{
        link.target='_blank';link.rel='noopener noreferrer';
      }
    });
    document.querySelectorAll('.chip').forEach(c=>{
      c.setAttribute('aria-pressed','true');
      c.addEventListener('click',()=>c.setAttribute('aria-pressed',String(!c.classList.contains('off'))));
    });
    document.querySelectorAll('.cp').forEach(function(button){
      button.onclick=async function(){
        const id=button.closest('.msg')?.id;if(!id)return;
        const url=new URL('/arcade',location.origin);url.searchParams.set('view','channel');url.hash=id;
        try{await navigator.clipboard.writeText(url.href);button.textContent='copied';}
        catch(e){button.textContent='link selected';const input=document.createElement('input');
          input.value=url.href;input.setAttribute('aria-label','Message permalink');button.after(input);input.select();}
      };
    });
    function notify(){
      if(parent===window)return;
      const count=messages.length,agents=new Set(messages.map(m=>m.dataset.attester)).size;
      parent.postMessage({type:'emem:channel-ready',count,agents,section,
        request:new URLSearchParams(location.search).get('deck'),
        status:document.getElementById('lvt')?.textContent||'archive'},location.origin);
    }
    const live=document.getElementById('lvt');
    if(live)new MutationObserver(notify).observe(live,{childList:true,characterData:true,subtree:true});
    notify();
    window.addEventListener('message',function(event){
      if(event.origin!==location.origin||event.source!==parent)return;
      if(event.data?.type==='emem:channel-section'&&panels.has(event.data.section)){
        select(event.data.section);window.scrollTo(0,0);
      }
    });
  });
})();
</script>

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ememdev"
# 1.1.0 adds the offline signing surface (ememdev.signing / ememdev.identity)
# and the `ememdev` CLI, so an agent can produce a memory-write attester block
# without a framework. 1.0.1 first superseded the empty 1.0.0 on PyPI (it
# shipped dist-info and no modules, so `import emem` raised ModuleNotFoundError;
# PyPI versions are immutable, so the only fix was to supersede it).
version = "1.2.1"
description = "Python client for emem.dev, the agent-native Earth memory protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vortx AI Private Limited", email = "avijeet@vortx.ai" },
]
keywords = [
    "earth-observation",
    "geospatial",
    "satellite",
    "mcp",
    "ed25519",
    "content-addressed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27,<1.0",
]

# The base client is httpx-only. Signing memory writes needs ed25519 + blake3,
# which are only pulled when you ask for them. `ememdev.signing` and the
# `ememdev` CLI's sign/write commands raise a clear install hint without this.
[project.optional-dependencies]
signing = [
    "blake3>=0.3",
    "cryptography>=41",
]

[project.scripts]
ememdev = "ememdev.__main__:main"

[project.urls]
Homepage = "https://emem.dev"
Repository = "https://github.com/Vortx-AI/emem"
Documentation = "https://emem.dev/agents.md"
Issues = "https://github.com/Vortx-AI/emem/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ememdev"]

[tool.hatch.build.targets.sdist]
include = ["src/ememdev", "README.md", "LICENSE"]

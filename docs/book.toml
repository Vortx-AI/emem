[book]
title       = "emem.dev — verifiable memory for AI agents"
authors     = ["Vortx-AI"]
description = "Earth memory + agent memory on one signed substrate. Every read returns an ed25519 receipt. Every write is content-addressed. Bi-temporal at every query."
src         = "."
language    = "en"

[output.html]
default-theme           = "light"
preferred-dark-theme    = "light"
git-repository-url      = "https://github.com/Vortx-AI/emem"
edit-url-template       = "https://github.com/Vortx-AI/emem/edit/main/docs/{path}"
site-url                = "/docs/"
no-section-label        = true
mathjax-support         = true
additional-css          = ["theme/emem.css"]
additional-js           = ["theme/emem-home.js"]

[output.html.fold]
enable = true
level  = 1

[output.html.search]
enable                  = true
limit-results           = 30
teaser-word-count       = 30
use-boolean-and         = true
boost-title             = 2
boost-hierarchy         = 2
boost-paragraph         = 1
expand                  = true
heading-split-level     = 3

[output.html.print]
enable = false

[preprocessor.links]

[preprocessor.index]

[build]
build-dir       = "book"
create-missing  = false

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="t d">
  <title id="t">Panel 4 commit-then-reveal timeline, 6 November 2026 (UTC)</title>
  <desc id="d">Six steps on one line. Both teams put the sha256 of their secret in the plan. At 20:29 a signed public note fixes the plan, the draw script, the tested file and both commitments. At 20:30 team A reveals its secret to team B. At 21:30 team B checks it against the commitment and finds that the hash is of the hex text. At 21:35 an addendum explains this without a change to the plan. The draw runs only after team B reveals.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #1f2328; }
    .time { font-size: 15px; font-weight: 600; }
    .lab { font-size: 12.5px; }
    .note { font-size: 12px; fill: #57606a; }
    .line { stroke: #57606a; stroke-width: 2; }
    .dot { fill: #ffffff; stroke: #1f2328; stroke-width: 2; }
    .key { fill: #1f2328; }
    .wait { fill: #ffffff; stroke: #57606a; stroke-width: 2; stroke-dasharray: 4 3; }
    .band { fill: #f6f8fa; stroke: #d0d7de; }
  </style>
  <rect x="0" y="0" width="880" height="330" fill="#ffffff"/>

  <text class="time" x="20" y="44">Panel 4, 6 November 2026 (UTC). Nothing is drawn before both secrets are revealed.</text>
  <line class="line" x1="60" y1="130" x2="640" y2="130"/>
  <line class="line" x1="640" y1="130" x2="830" y2="130" stroke-dasharray="6 5"/>

  <!-- 1 -->
  <circle class="dot" cx="72" cy="130" r="9"/>
  <text class="time" x="72" y="105" text-anchor="middle">before 20:29</text>
  <text class="lab" x="72" y="165" text-anchor="middle">Each team puts</text>
  <text class="lab" x="72" y="183" text-anchor="middle">sha256(secret)</text>
  <text class="lab" x="72" y="201" text-anchor="middle">in the plan</text>

  <!-- 2 -->
  <circle class="key" cx="196" cy="130" r="10"/>
  <text class="time" x="196" y="105" text-anchor="middle">20:29</text>
  <text class="lab" x="196" y="165" text-anchor="middle">Signed public note:</text>
  <text class="lab" x="196" y="183" text-anchor="middle">plan, draw script,</text>
  <text class="lab" x="196" y="201" text-anchor="middle">tested file, both</text>
  <text class="lab" x="196" y="219" text-anchor="middle">commitments</text>

  <!-- 3 -->
  <circle class="dot" cx="320" cy="130" r="9"/>
  <text class="time" x="320" y="105" text-anchor="middle">20:30</text>
  <text class="lab" x="320" y="165" text-anchor="middle">Team A reveals</text>
  <text class="lab" x="320" y="183" text-anchor="middle">its secret</text>
  <text class="lab" x="320" y="201" text-anchor="middle">to team B</text>

  <!-- 4 -->
  <circle class="dot" cx="444" cy="130" r="9"/>
  <text class="time" x="444" y="105" text-anchor="middle">21:30</text>
  <text class="lab" x="444" y="165" text-anchor="middle">Team B checks it:</text>
  <text class="lab" x="444" y="183" text-anchor="middle">match; the hash</text>
  <text class="lab" x="444" y="201" text-anchor="middle">is of the hex TEXT</text>

  <!-- 5 -->
  <circle class="dot" cx="568" cy="130" r="9"/>
  <text class="time" x="568" y="105" text-anchor="middle">21:35</text>
  <text class="lab" x="568" y="165" text-anchor="middle">Addendum</text>
  <text class="lab" x="568" y="183" text-anchor="middle">explains it;</text>
  <text class="lab" x="568" y="201" text-anchor="middle">plan unchanged</text>

  <!-- 6 -->
  <circle class="wait" cx="692" cy="130" r="9"/>
  <text class="time" x="692" y="105" text-anchor="middle">next</text>
  <text class="lab" x="692" y="165" text-anchor="middle">Team B reveals,</text>
  <text class="lab" x="692" y="183" text-anchor="middle">then the draw script</text>
  <text class="lab" x="692" y="201" text-anchor="middle">runs as written</text>

  <!-- 7 -->
  <circle class="wait" cx="816" cy="130" r="9"/>
  <text class="time" x="816" y="105" text-anchor="middle">later</text>
  <text class="lab" x="816" y="165" text-anchor="middle">Cards,</text>
  <text class="lab" x="816" y="183" text-anchor="middle">blind reads,</text>
  <text class="lab" x="816" y="201" text-anchor="middle">score</text>

  <text class="note" x="20" y="270">seed = int(sha256("&lt;secret A&gt;|&lt;secret B&gt;")[:16], 16). The draw script stops if a secret does not match its commitment.</text>
  <text class="note" x="20" y="292">Filled dot: the signed public note. Dashed circles and line: steps not yet done on 6 November 2026.</text>
</svg>

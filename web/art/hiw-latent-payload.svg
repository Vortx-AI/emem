<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" preserveAspectRatio="xMidYMid meet" width="1200" height="460">
<title>Madhubani panel: a kalash-crowned orbital payload at the source pours a slim stream of dotted latent-glyph beads down to a paper-2 ground station, framed by aripana descent-lines — the meaning travels, not the pixels.</title>
